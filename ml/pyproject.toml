[project]
name = "fruit-detector-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "python-multipart",
    "pydantic",
    "numpy",
    "pillow",
    "onnxruntime",
]

[project.optional-dependencies]
dev = ["uvicorn", "pytest"]

[tool.vercel]
entrypoint = "api:app"